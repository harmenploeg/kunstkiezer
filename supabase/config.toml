project_id = "kunstkiezer"
[api]
enabled = true
schemas = ["public"]
[auth]
enabled = true
site_url = "https://www.loci-amsterdam.nl/kunstkiezer/account"
additional_redirect_urls = ["https://www.loci-amsterdam.nl/kunstkiezer/account", "https://www.loci-amsterdam.nl/kunstkiezer/account?reset=1"]
minimum_password_length = 12
enable_signup = true
# Keep this configuration aligned with the hosted Auth dashboard.

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
double_confirm_changes = true
