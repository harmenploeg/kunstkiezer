project_id = "kunstkiezer"
[api]
enabled = true
schemas = ["public"]
[auth]
enabled = true
# Voorlopig op loci-kunstkiezer.pages.dev; kunstkiezer.loci-amsterdam.nl volgt zodra de
# DNS-regel bij Soverin er is. Beide staan al als toegestane redirect.
site_url = "https://loci-kunstkiezer.pages.dev/account"
# De oude adressen onder www.loci-amsterdam.nl/kunstkiezer verwijzen door; ze blijven
# toegestaan zodat mails van vóór de verhuizing blijven werken.
additional_redirect_urls = ["https://loci-kunstkiezer.pages.dev/account", "https://loci-kunstkiezer.pages.dev/account?reset=1", "https://kunstkiezer.loci-amsterdam.nl/account", "https://kunstkiezer.loci-amsterdam.nl/account?reset=1", "https://www.loci-amsterdam.nl/kunstkiezer/account", "https://www.loci-amsterdam.nl/kunstkiezer/account?reset=1"]
minimum_password_length = 12
enable_signup = true
# Keep this configuration aligned with the hosted Auth dashboard.

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
double_confirm_changes = true

# The function verifies the bearer token with Auth and checks the current kk_is_editor role.
[functions.manage-users]
verify_jwt = false
