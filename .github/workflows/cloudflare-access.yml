name: Controleer Cloudflare-toegang
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cloudflare-access.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - name: Controleer toegang tot Pages-project interactief
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not account:
              raise SystemExit('Cloudflare-secret of account-variable ontbreekt.')
          request = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/interactief',
              headers={'Authorization': f'Bearer {token}'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Cloudflare-toegang geweigerd: HTTP {error.code}.')
          if not result.get('success') or result.get('result', {}).get('name') != 'interactief':
              raise SystemExit('Pages-project kon niet worden bevestigd.')
          print('Cloudflare-toegang tot Pages-project interactief bevestigd. Er is niets gepubliceerd.')
          PY
