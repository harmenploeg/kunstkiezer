name: Publicatievoorbereiding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: kunstkiezer-pages
          path: apps/web/dist
      - run: echo 'Build gereed. Integratie met de gecontroleerde publicatie van harmenploeg/interactief is nog nodig; deze workflow publiceert niet.'
