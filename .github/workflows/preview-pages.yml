name: Publiceer Kunstkiezer-preview
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/preview-pages.yml']
permissions:
  contents: read
concurrency:
  group: kunstkiezer-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list
      - name: Verpak Pages-preview
        run: |
          mkdir -p pages-preview/kunstkiezer pages-preview/functions
          cp -R apps/web/dist/. pages-preview/kunstkiezer/
          cp -R functions/kunstkiezer pages-preview/functions/
      - name: Maak previewproject indien nodig
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, subprocess
          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/pages/projects/kunstkiezer',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          try:
              with urllib.request.urlopen(request, timeout=30): pass
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f'Pages-projectcontrole mislukt: HTTP {error.code}')
              subprocess.run(['npx', 'wrangler', 'pages', 'project', 'create', 'kunstkiezer', '--production-branch', 'main'], check=True)
          PY
      - name: Verbind publieke Supabase-configuratie
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/configure-pages-supabase.py
      - name: Publiceer afzonderlijke preview
        working-directory: pages-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../node_modules/.bin/wrangler pages deploy . --project-name kunstkiezer --branch main
